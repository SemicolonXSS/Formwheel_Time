<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>FormWheel Time</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fc;color:#172033}
button,input{font:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:10;padding:14px 18px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid #e8ebf2}
.nav{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{font-size:22px;font-weight:900;text-decoration:none;color:#172033}
.logo span{color:#5965f2}
.wrap{width:min(980px,94vw);margin:28px auto 50px}
.hero{text-align:center;margin-bottom:22px}
.hero h1{font-size:42px;margin:0 0 8px;letter-spacing:-1.5px}
.hero p{margin:0;color:#6b7280}
.panel{background:#fff;border:1px solid #e7eaf1;border-radius:22px;padding:22px;box-shadow:0 8px 28px rgba(20,30,60,.06)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.mode{padding:18px;border:2px solid #e7eaf1;background:#fff;border-radius:18px;text-align:left}
.mode.active{border-color:#5965f2;background:#f3f4ff}
.mode b{font-size:20px}
.mode small{display:block;color:#737b8c;margin-top:5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{width:100%;padding:13px 14px;border:1px solid #dfe3eb;border-radius:12px;outline:none}
input:focus{border-color:#5965f2}
.primary,.secondary{border:0;border-radius:12px;padding:13px 18px;font-weight:800}
.primary{background:#5965f2;color:white}
.secondary{background:#eef0f5;color:#263043}
.hidden{display:none!important}
.gameHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
.timer{font-size:38px;font-weight:900;letter-spacing:-1px}
.timer.low{color:#e5484d}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:7px 10px;background:#f0f2f7;border-radius:999px;font-size:13px;color:#5d6678}
.track{position:relative;width:min(430px,100%);height:620px;margin:0 auto;background:#101827;border-radius:24px;overflow:hidden;border:5px solid #263247;box-shadow:inset 0 0 0 2px #47536a}
.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.lane{border-right:2px dashed rgba(255,255,255,.13)}
.lane:last-child{border:0}
.player{position:absolute;bottom:42px;width:26%;left:37%;height:56px;display:flex;align-items:center;justify-content:center;font-size:32px;transition:left .12s ease;z-index:4}
.obj{position:absolute;width:26%;height:54px;display:flex;align-items:center;justify-content:center;font-size:31px;z-index:3}
.obstacle{filter:drop-shadow(0 5px 8px rgba(0,0,0,.3))}
.hourglass{filter:drop-shadow(0 5px 8px rgba(0,0,0,.3))}
.flash{animation:flash .22s ease}
@keyframes flash{50%{filter:brightness(1.8)}}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px auto 0;width:min(430px,100%)}
.control{height:58px;border:0;border-radius:16px;background:#fff;border:1px solid #dfe3eb;font-size:27px;font-weight:900}
.control:active{transform:scale(.97)}
.center{text-align:center}
.result h2{margin:0 0 8px;font-size:30px}
.big{font-size:52px;font-weight:950;margin:8px 0}
.note{color:#697386;font-size:14px;line-height:1.5}
.room{font-size:28px;font-weight:900;letter-spacing:5px}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}
.pbox{padding:13px;border-radius:14px;background:#f4f5f8;text-align:center}
.pbox.alive{background:#eef0ff}
@media(max-width:600px){
 .hero h1{font-size:34px}.panel{padding:16px}.modes{grid-template-columns:1fr}
 .track{height:540px}.players{grid-template-columns:1fr 1fr}.timer{font-size:31px}
}
</style>
</head>
<body>
<header class="top">
  <nav class="nav">
    <a class="logo" href="https://semicolonxss.github.io/Formwheel/">Form<span>Wheel</span> Time</a>
    <button id="homeBtn" class="secondary">메인으로</button>
  </nav>
</header>

<main class="wrap">
  <section id="menu" class="panel">
    <div class="hero">
      <h1>⏱️ FormWheel Time</h1>
      <p>3개의 레인을 이동하며 시간을 끝까지 지켜내세요!</p>
    </div>

    <div class="modes">
      <button class="mode active" id="soloMode" type="button">
        <b>🧍 Solo</b><small>혼자 최고 생존 기록에 도전</small>
      </button>
      <button class="mode" id="battleMode" type="button">
        <b>⚔️ Battle</b><small>같은 화면에서 여러 명이 경쟁</small>
      </button>
    </div>

    <div id="soloSetup">
      <input id="nickname" maxlength="12" placeholder="닉네임 (최대 12자)">
      <div class="row" style="margin-top:10px">
        <button id="soloStart" class="primary" type="button">Solo 시작</button>
      </div>
    </div>

    <div id="battleSetup" class="hidden">
      <input id="battleNames" maxlength="60" placeholder="닉네임 2~4개 (쉼표로 구분)">
      <p class="note">예: 민수, 철수, 영희 — 한 기기에서 번갈아 플레이하는 로컬 Battle입니다.</p>
      <button id="battleStart" class="primary" type="button">Battle 시작</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="gameHead">
      <div>
        <div id="modeLabel" class="badge">SOLO</div>
        <div id="turnLabel" style="font-weight:900;margin-top:5px"></div>
      </div>
      <div id="timer" class="timer">10.0</div>
    </div>
    <div class="stats">
      <div class="badge">💥 장애물: -3초</div>
      <div class="badge">⏳ 모래시계: +5초</div>
      <div id="scoreBadge" class="badge">생존 0.0초</div>
    </div>

    <div style="margin-top:14px">
      <div id="track" class="track">
        <div class="lanes"><div class="lane"></div><div class="lane"></div><div class="lane"></div></div>
        <div id="player" class="player">🟦</div>
      </div>
      <div class="controls">
        <button id="left" class="control" type="button" aria-label="왼쪽 이동">⬅️</button>
        <button id="right" class="control" type="button" aria-label="오른쪽 이동">➡️</button>
      </div>
    </div>
  </section>

  <section id="result" class="panel result hidden" style="margin-top:18px">
    <div class="center">
      <h2 id="resultTitle">게임 종료</h2>
      <div id="resultBig" class="big">0.0초</div>
      <p id="resultText" class="note"></p>
      <div class="row" style="justify-content:center;margin-top:15px">
        <button id="again" class="primary" type="button">다시 하기</button>
        <button id="menuBtn" class="secondary" type="button">메뉴</button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const menu=$("menu"), game=$("game"), result=$("result");
  const soloMode=$("soloMode"), battleMode=$("battleMode");
  const soloSetup=$("soloSetup"), battleSetup=$("battleSetup");
  const player=$("player"), track=$("track"), timerEl=$("timer"), scoreBadge=$("scoreBadge");
  let mode="solo", names=[], turn=0, lane=1, timeLeft=10, elapsed=0;
  let running=false, last=0, spawnTimer=0, raf=0, objects=[], hitCooldown=0;
  let results=[];

  function selectMode(m){
    mode=m;
    soloMode.classList.toggle("active",m==="solo");
    battleMode.classList.toggle("active",m==="battle");
    soloSetup.classList.toggle("hidden",m!=="solo");
    battleSetup.classList.toggle("hidden",m!=="battle");
  }
  soloMode.onclick=()=>selectMode("solo");
  battleMode.onclick=()=>selectMode("battle");
  $("homeBtn").onclick=()=>location.href="https://semicolonxss.github.io/Formwheel/";
  $("menuBtn").onclick=()=>showMenu();
  $("again").onclick=()=> mode==="solo" ? startSolo() : startBattle();

  function showMenu(){
    stop();
    menu.classList.remove("hidden"); game.classList.add("hidden"); result.classList.add("hidden");
  }

  function startSolo(){
    mode="solo"; names=[$("nickname").value.trim()||"Player"]; turn=0; results=[]; beginRound();
  }
  function startBattle(){
    const list=$("battleNames").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,4);
    names=list.length>=2?list:["Player 1","Player 2"];
    mode="battle"; turn=0; results=[]; beginRound();
  }

  $("soloStart").onclick=startSolo;
  $("battleStart").onclick=startBattle;

  function beginRound(){
    menu.classList.add("hidden"); result.classList.add("hidden"); game.classList.remove("hidden");
    lane=1; timeLeft=10; elapsed=0; spawnTimer=0; hitCooldown=0; objects.forEach(o=>o.el.remove()); objects=[];
    player.textContent="🟦"; updatePlayer();
    $("modeLabel").textContent=mode==="solo"?"SOLO":"BATTLE";
    $("turnLabel").textContent=mode==="solo"?names[0]:`${names[turn]} 차례`;
    running=true; last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  }

  function stop(){running=false;cancelAnimationFrame(raf);objects.forEach(o=>o.el.remove());objects=[];}

  function updatePlayer(){ player.style.left=(lane*33.333+3.667)+"%"; }

  function move(dir){
    if(!running)return;
    lane=Math.max(0,Math.min(2,lane+dir)); updatePlayer();
  }
  $("left").onclick=()=>move(-1); $("right").onclick=()=>move(1);
  document.addEventListener("keydown",e=>{
    if(!running)return;
    if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}
    if(e.key==="ArrowRight"){e.preventDefault();move(1)}
  });

  function spawn(){
    const el=document.createElement("div");
    const good=Math.random()<0.18;
    el.className="obj "+(good?"hourglass":"obstacle");
    el.textContent=good?"⏳":"💥";
    const l=Math.floor(Math.random()*3);
    el.style.left=(l*33.333+3.667)+"%";
    el.style.top="-62px";
    track.appendChild(el);
    objects.push({el,lane:l,y:-62,good,speed:180+Math.min(elapsed*7,220)});
  }

  function loop(now){
    if(!running)return;
    const dt=Math.min((now-last)/1000,.05); last=now;
    elapsed+=dt; timeLeft-=dt; spawnTimer-=dt; hitCooldown=Math.max(0,hitCooldown-dt);
    const difficulty=1+Math.min(elapsed/25,1.8);
    if(spawnTimer<=0){spawn();spawnTimer=Math.max(.26,.65-elapsed*.012)/difficulty}
    for(let i=objects.length-1;i>=0;i--){
      const o=objects[i]; o.y+=o.speed*dt*difficulty; o.el.style.top=o.y+"px";
      if(o.y>track.clientHeight+70){o.el.remove();objects.splice(i,1);continue}
      if(o.lane===lane && o.y>track.clientHeight-145 && o.y<track.clientHeight-55 && hitCooldown<=0){
        hitCooldown=.35; o.el.classList.add("flash");
        if(o.good) timeLeft+=5;
        else timeLeft-=3;
        o.el.remove();objects.splice(i,1);
      }
    }
    timerEl.textContent=Math.max(0,timeLeft).toFixed(1);
    timerEl.classList.toggle("low",timeLeft<=3);
    scoreBadge.textContent=`생존 ${elapsed.toFixed(1)}초`;
    if(timeLeft<=0){finishRound();return}
    raf=requestAnimationFrame(loop);
  }

  function finishRound(){
    running=false;
    cancelAnimationFrame(raf);
    objects.forEach(o=>o.el.remove());objects=[];
    results.push({name:names[turn],time:Math.max(0,elapsed)});
    if(mode==="battle" && turn<names.length-1){
      turn++;
      $("resultTitle").textContent=`${names[turn-1]} 종료`;
      $("resultBig").textContent=`${elapsed.toFixed(1)}초`;
      $("resultText").textContent=`다음은 ${names[turn]} 차례입니다. 준비되면 다시 시작하세요.`;
      result.classList.remove("hidden");
      $("again").textContent=`${names[turn]} 시작`;
    }else{
      const best=results.reduce((a,b)=>b.time>a.time?b:a,results[0]);
      $("resultTitle").textContent=mode==="solo"?"⏱️ 기록 달성":"🏆 Battle 종료";
      $("resultBig").textContent=`${best.time.toFixed(1)}초`;
      $("resultText").textContent=mode==="solo"
        ? `${names[0]}의 이번 생존 기록입니다. 장애물은 -3초, 모래시계는 +5초입니다.`
        : results.map((r,i)=>`${i+1}. ${r.name}: ${r.time.toFixed(1)}초`).join("  ·  ");
      result.classList.remove("hidden");
      $("again").textContent="다시 하기";
    }
  }
})();
</script>
</body>
</html>
